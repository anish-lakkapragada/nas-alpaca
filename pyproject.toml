[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nas-alpaca"
version = "0.1.0"
description = "Reproducible transformer architecture search on Stanford Alpaca"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["nas", "nas.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/test_arch.py"
